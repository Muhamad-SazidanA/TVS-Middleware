services:
  docmatch-db:
    image: postgres:16-alpine
    container_name: docmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docmatch}
      POSTGRES_USER: ${POSTGRES_USER:-docmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmatch_pass_change_me}
    volumes:
      - docmatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-docmatch} -d $${POSTGRES_DB:-docmatch}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - docmatch-net

  docmatch-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmatch-app
    restart: unless-stopped
    depends_on:
      docmatch-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      AUTH_TRUST_HOST: "true"
      RUN_DB_PUSH_ON_START: "true"
    ports:
      - "${DOCMATCH_PORT:-3100}:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
      - docmatch_config:/app/src/config
    networks:
      - docmatch-net

volumes:
  docmatch_postgres_data:
  docmatch_config:

networks:
  docmatch-net:
    driver: bridge
